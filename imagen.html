<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Elegance Fashion</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }
        /* CONTENEDOR DE LA IMAGEN */
        figure {
            margin: 30px auto;
            width: 80%;
            max-width: 900px;
        }
        /* IMAGEN */
        figure img {
            display: block;
            margin: 0 auto;
            width: 70%;
            max-width: 700px;
            height: auto;
        }
        /* TEXTO DEBAJO DE LA IMAGEN */
        figcaption {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }
        /*  INFORMACIÓN */
        .informacion {
            width: 80%;
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            text-align: left;
        }
        /* TÍTULO DE LA INFORMACIÓN */
        .informacion h2 {
            text-align: center;
            font-size: 30px;
        }
        /* PÁRRAFOS */
        .informacion p {
            font-size: 21px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- TÍTULO -->
    <h1>Elegance Fashion
    </h1>
    <!-- IMAGEN -->
    <figure>
         <img
                        src="camisa de algodón para mujer.jpeg"

                         <img
                        src="jeans para mujer.jpeg"
                        alt="Women's Jeans">
                         <img

                        alt="Men's Shirt">
                          <img
                        src="pantalón para hombre.jpeg"
                        alt="Men's Pants">
                          <img
                        src="chaqueta de hombre.jpeg"
                        alt="Men's Jacket">
                         </div>
</body>
</html>
