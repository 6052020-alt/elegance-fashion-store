<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elegance Fashion</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f8e8ee,
                #fff7fa,
                #ead0da
            );

            color: #4a2635;
        }

        .loading-container {
            width: 90%;
            max-width: 550px;

            background: rgba(255, 255, 255, 0.88);

            padding: 50px 35px;

            text-align: center;

            border-radius: 22px;

            box-shadow:
                0 10px 35px rgba(74, 38, 53, 0.18);

            border: 1px solid rgba(139, 74, 98, 0.15);
        }

        .brand {
            color: #8b4a62;

            font-size: 42px;

            margin: 0 0 10px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 17px;

            color: #6d4555;

            margin: 0 0 35px;

            letter-spacing: 0.5px;
        }

        .loader {
            width: 65px;
            height: 65px;

            margin: 0 auto 30px;

            border: 6px solid #ead0da;

            border-top: 6px solid #8b4a62;

            border-radius: 50%;

            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

        .loading-text {
            font-size: 16px;

            color: #6d4555;

            margin-bottom: 18px;
        }

        .progress-container {
            width: 100%;

            height: 8px;

            background: #ead0da;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;

            width: 0%;

            background: #8b4a62;

            border-radius: 20px;

            animation: loading 5s linear forwards;
        }

        @keyframes loading {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }

        }

        .welcome {
            margin-top: 25px;

            font-size: 14px;

            color: #8b4a62;

            letter-spacing: 0.3px;
        }

        .footer-text {
            margin-top: 30px;

            font-size: 12px;

            color: #92717e;
        }

        @media (max-width: 600px) {

            .loading-container {
                padding: 40px 25px;
            }

            .brand {
                font-size: 32px;
            }

            .subtitle {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <div class="loading-container">

        <h1 class="brand">
            Elegance Fashion
        </h1>

        <p class="subtitle">
            Fashion, elegance and style in one place.
        </p>


        <div class="loader"></div>


        <p class="loading-text">
            Preparing your experience...
        </p>


        <div class="progress-container">

            <div class="progress-bar"></div>

        </div>


        <p class="welcome">
            Welcome to Elegance Fashion
        </p>


        <p class="footer-text">
            Please wait while we prepare our collection for you.
        </p>

    </div>


    <script>

        setTimeout(function() {

            window.location.href = "ingles.html";

        }, 5000);

    </script>


</body>

</html>
